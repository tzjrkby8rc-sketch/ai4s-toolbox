<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>营销要点库 · AI4S 科研赋能工具箱</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--pri:#7c3aed;--acc:#0e9f6e;--ink:#111827;--sub:#6b7280;--line:#e5e7eb;--bg:#f9fafb}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);background:var(--bg);line-height:1.75}
.wrap{max-width:920px;margin:0 auto;padding:0 20px}
nav{position:sticky;top:0;background:rgba(255,255,255,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);z-index:50}
nav .wrap{display:flex;align-items:center;justify-content:space-between;height:60px}
.logo{font-weight:800;font-size:18px;color:var(--pri);text-decoration:none}
.back{font-size:14px;color:var(--sub);text-decoration:none}
.head{padding:46px 0 26px;text-align:center}
.head h1{font-size:30px;font-weight:800;margin-bottom:10px}
.head p{color:var(--sub);font-size:15px}
.toc{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:34px}
.toc a{border:1.5px solid var(--line);background:#fff;padding:8px 18px;border-radius:20px;font-size:14px;text-decoration:none;color:var(--ink);transition:.15s}
.toc a:hover{border-color:var(--pri);color:var(--pri)}
.playbook{background:#fff;border:1px solid var(--line);border-radius:14px;padding:40px 44px}
@media(max-width:640px){.playbook{padding:24px}}
.md h1{font-size:23px;margin:26px 0 12px;color:var(--pri)}
.md h2{font-size:20px;margin:24px 0 10px;color:var(--pri);border-bottom:2px solid var(--line);padding-bottom:6px}
.md h3{font-size:17px;margin:18px 0 8px}
.md h4{font-size:15px;margin:14px 0 6px}
.md p{margin:10px 0;font-size:15px}
.md ul,.md ol{margin:10px 0 10px 24px;font-size:15px}
.md li{margin:6px 0}
.md strong{color:var(--ink)}
.md table{border-collapse:collapse;width:100%;margin:14px 0;font-size:13.5px}
.md th,.md td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
.md th{background:#f3f4f6;font-weight:700}
.md blockquote{border-left:4px solid var(--acc);background:#f0fdf4;padding:12px 16px;margin:14px 0;border-radius:6px;color:#065f46}
.md code{background:#f3f4f6;padding:2px 6px;border-radius:4px;font-size:13px}
.md hr{border:none;border-top:2px dashed var(--line);margin:28px 0}
footer{background:#111827;color:#9ca3af;text-align:center;padding:28px 0;font-size:13px;margin-top:40px}
</style></head><body>
<nav><div class="wrap">
  <a class="logo" href="index.html">📖 营销要点库</a>
  <a class="back" href="index.html">← 返回门户</a>
</div></nav>
<div class="wrap">
  <div class="head">
    <h1>6 学科营销要点库</h1>
    <p>落地页文案 / 朋友圈 / 邮件 / 讲座开场的成品话术 · 数据全部来自真实课程/工具/政策</p>
  </div>
  <div class="toc" id="toc"></div>
  <div class="playbook md" id="content"></div>
</div>
<footer>营销要点库 · 数据来源于智爱赛思公开知识库 · 仅供内部营销使用</footer>
<script src="data/playbook.js"></script>
<script>
function md(src){
  let h=src;
  h=h.replace(/(^\|.*\|[ \t]*\n)+/gm,block=>{
    const rows=block.trim().split('\n').map(r=>r.trim());
    let out='<table>';
    rows.forEach((r,i)=>{
      if(/^\|[\s:|-]+\|$/.test(r))return;
      const cs=r.split('|').slice(1,-1).map(c=>c.trim());
      if(i===0)out+='<tr>'+cs.map(c=>'<th>'+c+'</th>').join('')+'</tr>';
      else out+='<tr>'+cs.map(c=>'<td>'+c+'</td>').join('')+'</tr>';
    });
    return out+'</table>';
  });
  h=h.replace(/^#### (.*)$/gm,'<h4>$1</h4>').replace(/^### (.*)$/gm,'<h3>$1</h3>')
     .replace(/^## (.*)$/gm,'<h2>$1</h2>').replace(/^# (.*)$/gm,'<h1>$1</h1>');
  h=h.replace(/^> (.*)$/gm,'<blockquote>$1</blockquote>');
  h=h.replace(/^---+$/gm,'<hr>');
  h=h.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/`([^`]+)`/g,'<code>$1</code>');
  h=h.replace(/(https?:\/\/[^\s)<]+)/g,'<a href="$1" target="_blank" style="color:var(--pri)">$1</a>');
  h=h.replace(/^\s*[-*] (.*)$/gm,'<li>$1</li>');
  h=h.replace(/(<li>[\s\S]*?<\/li>)(?!\s*<li>)/g,'<ul>$1</ul>');
  h=h.replace(/<\/ul>\s*<ul>/g,'');
  h=h.replace(/^\d+\. \*\*(.+?)\*\*/gm,'<li><strong>$1</strong></li>');
  h=h.replace(/^\d+\. (.*)$/gm,'<li>$1</li>');
  h=h.split(/\n{2,}/).map(b=>{
    b=b.trim();if(!b)return '';
    if(/^<(h\d|ul|ol|table|blockquote|hr|li)/.test(b))return b;
    return '<p>'+b.replace(/\n/g,'<br>')+'</p>';
  }).join('\n');
  return h;
}
const DISC=["生命科学","物质科学","工程技术","地球环境","数学量子","交叉学科"];
// 给学科标题加锚点
let html=md(PLAYBOOK_MD);
DISC.forEach(d=>{
  html=html.replace('<h2>'+d+'</h2>','<h2 id="'+d+'">'+d+'</h2>');
});
document.getElementById('content').innerHTML=html;
document.getElementById('toc').innerHTML=DISC.map(d=>'<a href="#'+d+'">'+d+'</a>').join('');
</script>
</body></html>
